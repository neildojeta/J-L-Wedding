<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A1010" />
    <meta
      name="description"
      content="You are cordially invited to celebrate the wedding of Jonmarck &amp; Linneth on October 17, 2026. Open the letter for details and to RSVP."
    />
    <!-- Link previews: Messenger, Viber, WhatsApp, Facebook, iMessage, X.

         Every URL below is absolute on purpose. A crawler fetches the page
         without a browser and does not resolve a relative og:image against
         it, so "/theme/share-card.png" would give every guest a preview with
         no picture. If the site ever moves to a custom domain, the three
         occurrences of the host in this block are the only things to change.

         The card itself is drawn by scripts/make-share-card.py — 1200x630,
         which is the shape these apps crop to, and 155 KB, which is under
         the roughly 300 KB above which WhatsApp quietly drops the thumbnail. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jonmarck &amp; Linneth" />
    <meta property="og:url" content="https://jl-wedding.onrender.com/" />
    <meta property="og:title" content="Jonmarck &amp; Linneth — You Are Invited" />
    <meta
      property="og:description"
      content="You are cordially invited to celebrate the wedding of Jonmarck &amp; Linneth on October 17, 2026. Open the letter for details and to RSVP."
    />
    <meta
      property="og:image"
      content="https://jl-wedding.onrender.com/theme/share-card.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://jl-wedding.onrender.com/theme/share-card.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The J and L monogram in gold on deep red, above the names Jonmarck and Linneth and the date 17 October 2026"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jonmarck &amp; Linneth — You Are Invited" />
    <meta
      name="twitter:description"
      content="You are cordially invited to celebrate the wedding of Jonmarck &amp; Linneth on October 17, 2026. Open the letter for details and to RSVP."
    />
    <meta
      name="twitter:image"
      content="https://jl-wedding.onrender.com/theme/share-card.png"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%237A1010'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Georgia,serif' fill='%23E3CDA8' text-anchor='middle'%3EJL%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Jonmarck &amp; Linneth — You Are Invited</title>
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
