# Render Blueprint — deploys the invitation as a static site.
# In Render: New + -> Blueprint -> pick this repository.
services:
  - type: web
    name: jl-wedding
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Set the values in the Render dashboard (Environment tab).
      # These are Vite build-time variables, so a change needs a redeploy.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: serve index.html for any unknown path.
      - type: rewrite
        source: /*
        destination: /index.html
